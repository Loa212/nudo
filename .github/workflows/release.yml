name: release

on:
  push:
    tags: ["v*"]

# The release job needs to create a release and attach assets; the image job
# needs to push to GHCR.
permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # The gnu build links against the host's glibc, so it needs a
            # reasonably old one to be broadly usable. Ubuntu's default is fine
            # for current distributions.
            musl: false
          - target: x86_64-unknown-linux-musl
            # Fully static: runs on anything, including a distroless or Alpine
            # host, which is the point of shipping it.
            musl: true

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler
          if [ "${{ matrix.musl }}" = "true" ]; then
            sudo apt-get install --no-install-recommends -y musl-tools
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --bin nudo-server --bin nudo-web --bin nudo --bin nudo-mcp \
            --bin nudo-all-in-one

      - name: Confirm the musl build is actually static
        if: matrix.musl == true
        run: |
          # A dynamically linked "static" binary would fail on the hosts people
          # reach for musl to support, so this is checked rather than assumed.
          #
          # Asks the ELF header rather than parsing `ldd` output.
          #
          # The previous version grepped `ldd` for "not a dynamic executable"
          # with `grep -qv`, which matches *any* other line — including the
          # blank one `ldd` prints, and including the "statically linked" that
          # a correctly static musl binary actually produces. So the check
          # failed the release on binaries that were exactly right.
          #
          # The property being tested is "depends on no shared library at run
          # time", which is NEEDED entries in the dynamic section. Not INTERP:
          # Rust links musl targets as `-static-pie`, so a genuinely static
          # binary still carries an interpreter segment. Testing for that would
          # reject every binary this job produces.
          sudo apt-get install --no-install-recommends -y binutils
          failed=0
          for binary in nudo-server nudo-web nudo nudo-mcp nudo-all-in-one; do
            path="target/${{ matrix.target }}/release/$binary"

            needed=$(readelf -d "$path" 2>/dev/null | grep -c "(NEEDED)" || true)

            if [ "$needed" -ne 0 ]; then
              echo "::error::$binary links against shared libraries at run time"
              readelf -d "$path" | grep "(NEEDED)" || true
              failed=1
            else
              echo "$binary: static (no shared library dependencies)"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "all binaries are statically linked"

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          name="nudo-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"

          for binary in nudo-server nudo-web nudo nudo-mcp nudo-all-in-one; do
            cp "target/${{ matrix.target }}/release/$binary" "dist/${name}/"
          done
          cp README.md CHANGES.md NOTICE LICENSE "dist/${name}/" 2>/dev/null || true
          cp packaging/nudo.service "dist/${name}/" 2>/dev/null || true

          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          # Checksums so an operator can verify what they downloaded.
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: nudo-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  image:
    name: ghcr image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish the release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      # The manifest commit needs the full history for git-cliff, and a token
      # that can push back to the default branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # The tag is v1.2.3; the image tags and the manifest use 1.2.3. Derived
      # once here rather than stripping the prefix at each use.
      - name: Derive the version number and image path
        id: version
        run: |
          # The tag is v1.2.3; the image tags and the manifest use 1.2.3.
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # GHCR paths are lowercase, and the owner here is not. Without this
          # the release body prints a `docker run` that cannot be copied:
          # ghcr.io/Loa212/nudo is a 404 while ghcr.io/loa212/nudo is the image.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Only the archives this workflow uploaded. Without a pattern the
          # action also tries to pull the `.dockerbuild` build record that
          # docker/build-push-action uploads on its own, which fails to download
          # and takes the whole publish step with it — after both real artifacts
          # had already arrived intact.
          pattern: nudo-*

      - name: Attach the assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
          body: |
            ## Install

            **Binaries** — download the archive for your platform below, verify
            it against its `.sha256`, and unpack it. `x86_64-unknown-linux-musl`
            is fully static and runs anywhere.

            ```sh
            tar -xzf nudo-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
            sudo install nudo-*/nudo* /usr/local/bin/
            ```

            **Docker**

            ```sh
            docker run -d --name nudo -p 3000:3000 \
              -e NUDO_SECRET_KEY="$(openssl rand -hex 32)" \
              -v nudo-state:/var/lib/nudo \
              ${{ steps.version.outputs.image }}:${{ steps.version.outputs.number }}
            ```

            Then open <http://localhost:3000> and create the first account.
            See the README for the quickstart to a first deploy.

      # Everything below publishes the changelog. Running instances read
      # releases.json to tell their operator a new version exists and to render
      # the notes in the dashboard, so a release that skips this ships silently.

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Add this release to releases.json
        run: |
          version="${GITHUB_REF_NAME#v}"

          # What changed, not how to install. The release page carries the
          # install instructions because that is where someone arrives to
          # download; the dashboard's "What's new" is read by people who are
          # already running it, for whom install steps are noise.
          #
          # git-cliff has already written CHANGELOG.md for this tag, so this
          # pulls that version's section out of it.
          python3 scripts/changelog-section.py "${version}" > notes.md

          python3 scripts/add-release.py \
            --version "${version}" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --manifest releases.json
          rm -f notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the manifest and the changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json CHANGELOG.md

          # A tag that changed neither is not an error: re-running the workflow
          # for an already-published release should be a no-op, not a failure.
          if git diff --cached --quiet; then
            echo "nothing to commit — the manifest already has ${GITHUB_REF_NAME}"
            exit 0
          fi

          git commit -m "Publish ${GITHUB_REF_NAME}

          Adds the release to releases.json, which running instances fetch to
          tell their operator a new version is out, and regenerates CHANGELOG.md.
          Made by the release workflow."
          git push origin HEAD:main
