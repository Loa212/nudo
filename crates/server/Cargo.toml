[package]
name = "nudo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Control plane: gRPC API, deploy engine, SSH executor and state"

[[bin]]
name = "nudo-server"
path = "src/main.rs"

[lib]
name = "nudo_server"
path = "src/lib.rs"

[dependencies]
nudo-proto.workspace = true

tonic.workspace = true
