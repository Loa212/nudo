[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/format",
    "crates/server",
    "crates/web",
    "crates/cli",
    "crates/mcp",
    "crates/allinone",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Loa212/nudo"

[workspace.dependencies]
# Internal
nudo-proto = { path = "crates/proto" }
nudo-format = { path = "crates/format" }
nudo-server = { path = "crates/server" }
nudo-web = { path = "crates/web" }

# gRPC / protobuf
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"

# Async runtime
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "fs",
    "io-util",
    "signal",
] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-stream = "0.3"

# Web
axum = { version = "0.8", features = ["tokio", "http1", "ws", "multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
# Named directly for its `time::Duration`, which axum-extra does not re-export.
cookie = "0.18"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
maud = { version = "0.27", features = ["axum"] }
http = "1"
http-body-util = "0.1"
mime_guess = "2"
urlencoding = "2"

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "sqlite-bundled",
    "runtime-tokio",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# SSH
russh = "0.62"

# GitHub
octocrab = "0.54"
# rust_crypto rather than aws_lc_rs: pure Rust keeps the musl static-binary
# build free of a C toolchain dependency.
jsonwebtoken = { version = "11", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }

# Crypto
aes-gcm = "0.11"
argon2 = "0.5"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
base64 = "0.22"
rand = "0.9"
hex = "0.4"

# MCP
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
schemars = "1"

# Serde / misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
shell-escape = "0.1"

# Dev / test
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
