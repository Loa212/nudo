[package]
name = "nudo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Control plane: gRPC API, deploy engine, SSH executor and state"

[[bin]]
name = "nudo-server"
path = "src/main.rs"

[lib]
name = "nudo_server"
path = "src/lib.rs"

[dependencies]
nudo-proto.workspace = true
nudo-format.workspace = true

tonic.workspace = true
tonic-prost.workspace = true
tonic-health.workspace = true
# The API-token layer is a tower middleware over the HTTP request.
tower = { workspace = true, features = ["util"] }
http.workspace = true
prost.workspace = true
prost-types.workspace = true

tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
async-stream.workspace = true

sqlx.workspace = true
russh.workspace = true

octocrab.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true

aes-gcm.workspace = true
argon2.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
base64.workspace = true
rand.workspace = true
hex.workspace = true

serde.workspace = true
serde_json.workspace = true
clap.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
shell-escape.workspace = true
urlencoding.workspace = true
# Not dev-only: the deploy-key clone path writes the key to a temp file for the
# lifetime of the git process.
tempfile.workspace = true

# Self-upgrade: the journal and atomic symlink swap shared with the boot
# guard, and unpacking the downloaded release tarball.
nudo-bootguard.workspace = true
tar.workspace = true
flate2.workspace = true

[features]
# The end-to-end deployment test needs Docker to start a systemd-enabled
# container, so it is opt-in rather than part of `cargo test`.
e2e = []
# Test seams for the self-upgrade end-to-end test, never enabled by a release
# build: `current_version()` honours a `.version-override` file beside the
# executable (so one binary can play both sides of an upgrade), and the
# managed-layout eligibility check stops requiring x86_64 Linux (so the test
# runs on developer machines).
self-upgrade-test = []

[dev-dependencies]
wiremock.workspace = true
# The GitHub tests decode the JWT the client presents, to prove it is RS256 and
# signed by the App's key.
jsonwebtoken.workspace = true
