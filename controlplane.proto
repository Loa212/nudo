syntax = "proto3";

package controlplane.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// Who initiated a mutating call. Every mutating RPC carries one so the audit
// log can distinguish a human clicking deploy from an agent calling an MCP
// tool from a webhook firing on push.
message Actor {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    HUMAN = 1;   // dashboard or CLI session
    AGENT = 2;   // MCP tool call
    WEBHOOK = 3; // GitHub push / PR event
    SYSTEM = 4;  // scheduled or internal (e.g. health-check rollback)
  }
  Kind kind = 1;
  string id = 2;      // user id, agent session id, webhook delivery id
  string label = 3;   // human-readable, shown in audit UI
}

// Attached to mutating RPCs. dry_run lets an agent (or a nervous human)
// see the plan without executing it.
message Mutation {
  Actor actor = 1;
  bool dry_run = 2;
  // Required to mutate a target with latency_critical = true. Guardrail
  // against an agent touching the hot-path box unattended.
  bool allow_latency_critical = 3;
  // Optional idempotency key — retrying with the same key returns the
  // original result instead of running twice.
  string idempotency_key = 4;
}

// ---------------------------------------------------------------------------
// Targets — the machines we deploy to
// ---------------------------------------------------------------------------

message Target {
  string id = 1;
  string name = 2;
  string host = 3;              // hostname or IP
  uint32 port = 4;              // ssh port, default 22
  string user = 5;              // ssh user
  string ssh_key_id = 6;        // reference into the secret store, never the key itself

  // Marks a box where nothing extra should run and no unattended mutation
  // should happen — e.g. the HFT bot's machine. Enforced server-side.
  bool latency_critical = 7;

  map<string, string> labels = 8;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    UNKNOWN = 1;
    REACHABLE = 2;
    UNREACHABLE = 3;
  }
  Status status = 9;
  google.protobuf.Timestamp last_seen_at = 10;
  string agent_version = 11;    // empty when running agentless (pure ssh)

  google.protobuf.Timestamp created_at = 12;

  // The pinned SSH host key, trusted on first use and verified on every
  // connection after that. Public key material, so it is safe to return.
  HostKey host_key = 13;

  // How traffic reaches the services on this host, if nudo is involved at all.
  // Unset means no ingress, which is what every target that predates this
  // field has and what a new one gets until an operator asks for otherwise.
  Ingress ingress = 14;
}

// A target's reverse proxy: whether nudo manages one, and what state it is in.
//
// Deliberately a property of the target rather than a service of its own. A
// proxy is not another workload on the box — it is the thing every workload's
// traffic passes through, so its failure takes the whole host offline rather
// than one app. Modelling it as a service would have reused the deploy engine,
// but it would also have made it deletable, rollback-able and deployable by the
// same paths as an ordinary app, which is exactly the handling it should not
// get. It has no artifact source either: Caddy comes from its own release page,
// not from a git build or an upload.
message Ingress {
  enum Mode {
    // No ingress. Reaching a service is the operator's problem, as it was
    // before this existed.
    MODE_UNSPECIFIED = 0;
    // nudo installs Caddy, writes its config, and reloads it.
    MANAGED = 1;
    // A proxy is already on this host and the operator drives it. nudo renders
    // the config it *would* write, so it can be copied, but never touches the
    // host. For someone with an existing nginx they are not giving up.
    EXTERNAL = 2;
  }
  Mode mode = 1;

  // Where Caddy's admin API listens. Loopback-only; the reload goes through it
  // rather than through a restart, because a restart drops connections for
  // every other service on the host.
  uint32 admin_port = 2;

  // The email Let's Encrypt gets for expiry warnings. Optional — Caddy issues
  // certificates without one — but strongly wanted, since without it the only
  // notice of an expiring certificate is the outage.
  string acme_email = 3;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Configured but nudo has not yet installed or reached it.
    PENDING = 1;
    // Installed, reachable, and serving the config nudo last wrote.
    ACTIVE = 2;
    // Installed but the last reload failed, or it is not answering. The routes
    // it is serving are the previous ones.
    DEGRADED = 3;
  }
  Status status = 4;

  // Caddy's version, as it reports itself. Empty until first installed.
  string version = 5;

  google.protobuf.Timestamp last_reload_at = 6;
  // Why the last reload failed, empty when it did not. Kept rather than only
  // logged: a degraded proxy is found by looking at the target, not by
  // remembering which deploy broke it.
  string last_error = 7;
}

// A target's pinned host key, and any change waiting to be reviewed.
//
// Both halves carry the key itself and not only its fingerprint, so a change can
// be shown — algorithm, full key, both fingerprints — rather than merely
// reported.
message HostKey {
  // OpenSSH one-line form ("ssh-ed25519 AAAA..."). Empty until the first
  // successful connection pins one.
  string key = 1;
  // The SHA-256 fingerprint, as ssh-keygen prints it ("SHA256:...").
  string fingerprint = 2;
  google.protobuf.Timestamp pinned_at = 3;

  // A key presented by the host that did not match the pinned one. Set by a
  // refused connection; every connection stays refused until it is accepted or
  // the host presents the pinned key again.
  string pending_key = 4;
  string pending_fingerprint = 5;
  google.protobuf.Timestamp pending_seen_at = 6;
}

// Accepts a target's current host key.
//
// With a change pending, this promotes it to the pinned key — the flow for a
// legitimately rebuilt host. It is deliberately a mutation like any other: it is
// authorized, guarded on latency-critical hosts, and audited with the
// fingerprint that was accepted and by whom.
message AcceptHostKeyRequest {
  Mutation mutation = 1;
  string id = 2;
  // The fingerprint being accepted, which must match the pending one. Required:
  // an operator accepts a key they have looked at, and this is what makes the
  // acceptance refer to that key rather than to whatever is pending by the time
  // the request lands.
  string fingerprint = 3;
}

// Forgets a target's pinned host key, so the next connection pins afresh.
//
// The escape hatch for a host that was rebuilt while nobody was watching and
// whose old key is of no further interest. It reopens the first-use window, so
// it is a mutation, guarded and audited like an acceptance.
message ForgetHostKeyRequest {
  Mutation mutation = 1;
  string id = 2;
}

message CreateTargetRequest {
  Mutation mutation = 1;
  string name = 2;
  string host = 3;
  uint32 port = 4;
  string user = 5;
  string ssh_key_id = 6;
  bool latency_critical = 7;
  map<string, string> labels = 8;
}

message UpdateTargetRequest {
  Mutation mutation = 1;
  string id = 2;
  Target target = 3;            // fields present in update_mask
  repeated string update_mask = 4;
}

message DeleteTargetRequest {
  Mutation mutation = 1;
  string id = 2;
}

message GetTargetRequest { string id = 1; }

message ListTargetsRequest {
  string label_selector = 1;    // e.g. "env=prod,role=indexer"
  uint32 page_size = 2;
  string page_token = 3;
}

message ListTargetsResponse {
  repeated Target targets = 1;
  string next_page_token = 2;
}

// Probes the host key, ssh reachability, sudo, systemd presence, and a writable
// release dir.
message CheckTargetRequest { string id = 1; }

message CheckTargetResponse {
  bool ok = 1;
  message Check {
    // "host_key", "ssh", "sudo", "systemd", "release_dir"
    string name = 1;
    bool ok = 2;
    string detail = 3;
  }
  repeated Check checks = 2;
}

// ---------------------------------------------------------------------------
// Ingress — how traffic from the outside reaches a service
// ---------------------------------------------------------------------------

// Turns ingress on for a target, or changes its settings.
//
// Installing a proxy on a host is a mutation of that host, so it goes through
// the same authorization as any other: on a latency-critical target it needs
// `allow_latency_critical`. That is deliberate rather than incidental — putting
// a proxy in front of a latency-tuned box is precisely the kind of change the
// flag exists to make somebody say out loud.
message EnableIngressRequest {
  Mutation mutation = 1;
  string target_id = 2;
  Ingress.Mode mode = 3;
  // Defaults to 2019, Caddy's own default, when zero.
  uint32 admin_port = 4;
  string acme_email = 5;
}

// Turns ingress off. The proxy is stopped and disabled but its config is left on
// disk: an operator turning ingress off to debug something should not have to
// reconstruct it, and the file is inert once the unit is not running.
message DisableIngressRequest {
  Mutation mutation = 1;
  string target_id = 2;
}

// The config nudo would write for this target, without writing it.
//
// The `RenderUnit` of ingress, and for the same reason: the operator sees what
// is about to be applied before it is applied. It is also the whole of what
// EXTERNAL mode offers — render it, copy it, run your own proxy.
message RenderIngressRequest { string target_id = 1; }

message RenderIngressResponse {
  string config = 1;
  // Where it would be written on the target.
  string path = 2;
  // The routes the config encodes, in the order they appear. Lets a caller show
  // a table rather than parse a Caddyfile.
  repeated Route routes = 3;
}

// One service's route through the proxy.
// One way in to a service: a hostname, optionally a path under it, and the port
// behind it.
//
// A service has a list of these rather than a single domain and port, because
// one service legitimately answers on several: an apex and its `www`, a public
// domain and an internal one, or `/api` on a domain whose root is served by
// something else. Coolify stores the same thing as a comma-separated list of
// URLs and parses host, path and port back out of each; this is that, with the
// parts named.
message Route {
  // The hostname to route on ("api.example.com"). Required.
  string domain = 1;

  // The path prefix, if this route is only part of a domain. Empty or "/" means
  // the whole domain.
  //
  // The prefix is stripped before the request reaches the service, so a service
  // routed at "/api" sees "/users", not "/api/users". That matches what Coolify
  // does by default and is almost always what is wanted; a service that needs
  // the prefix intact should be routed at the domain root instead.
  string path = 2;

  // Where the service listens on the target's loopback.
  uint32 port = 3;

  // What the service speaks, which decides how the proxy talks to it.
  enum Protocol {
    // HTTP/1.1 and HTTP/2 over TLS at the edge, HTTP/1.1 to the service. The
    // default, and right for anything serving a website or a REST API.
    PROTOCOL_UNSPECIFIED = 0;
    // Cleartext HTTP/2 to the service — what a gRPC server speaks. gRPC
    // requires HTTP/2 end to end, and a proxy that downgrades to HTTP/1.1
    // silently breaks every call, so this has to be stated rather than
    // guessed.
    H2C = 1;
  }
  Protocol protocol = 4;

  // Set on the way out, not stored: which service this route belongs to. Lets a
  // caller render a table of a target's routes without joining anything.
  string service_id = 5;
  string service_name = 6;
}

// Writes the config and reloads the proxy.
//
// Normally implicit: a deploy re-renders the routes for its target, so an
// operator rarely calls this. It exists for the case where the proxy and the
// database have drifted — a host rebuilt underneath nudo, a hand-edited config
// — and for retrying a reload that failed.
message ReloadIngressRequest {
  Mutation mutation = 1;
  string target_id = 2;
}

message ReloadIngressResponse {
  bool ok = 1;
  // What the proxy said when it rejected the config, empty when it did not.
  string error = 2;
  repeated Route routes = 3;
}

// Diagnoses whether ingress on this target can actually serve its domains.
//
// The check that matters is DNS: a domain whose A record does not point at this
// host cannot be issued a certificate, and Caddy will retry indefinitely
// without saying why in a place anyone looks. That failure is the single most
// common way this feature disappoints someone, so it is diagnosed explicitly
// rather than left as a pending state.
message CheckIngressRequest { string target_id = 1; }

message CheckIngressResponse {
  bool ok = 1;
  message Check {
    // "installed", "running", "admin_api", "config", or a domain name for the
    // per-domain DNS checks.
    string name = 1;
    bool ok = 2;
    string detail = 3;
  }
  repeated Check checks = 2;
  // Non-fatal notes: a domain that does not resolve here yet is a warning
  // rather than a failure, because the operator may be about to create the
  // record. Kept out of `ok` for the same reason as on a build host — a CI step
  // gating on readiness should not fail on a state that is merely early.
  repeated string warnings = 3;
}

// ---------------------------------------------------------------------------
// Build hosts — where a build runs, when it does not run on the control plane
// ---------------------------------------------------------------------------

// A machine that builds, reached over SSH.
//
// Deliberately not a `Target`. The two share reachability, an SSH user and a
// key, and nothing else: a build host has no release root, no unit and nothing
// deployed to it, and a target must never be sent a build. Keeping them apart
// makes "a build host is not a deploy target" a property of the model rather
// than a rule someone has to remember.
//
// A build host is not a sandbox. Two builds running here can see each other,
// and nudo does not isolate them; that is a property of how the host is run —
// one-shot container, ephemeral VM, fresh instance per build — and remains the
// operator's decision.
message BuildHost {
  string id = 1;
  string name = 2;
  string host = 3;              // hostname or IP
  uint32 port = 4;              // ssh port, default 22
  string user = 5;              // ssh user
  string ssh_key_id = 6;        // reference into the secret store, never the key itself

  // Where checkouts and build trees go. Each build gets a fresh directory
  // underneath, removed when it finishes however it finishes.
  string workspace_root = 7;    // default "/var/lib/nudo/builds"

  // Marks a box where a build competes with something latency-sensitive for
  // CPU, cache and memory bandwidth. Permitted — an operator may have exactly
  // one spare machine — but surfaced everywhere it is relevant rather than
  // silently accepted.
  bool latency_critical = 8;

  map<string, string> labels = 9;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    UNKNOWN = 1;
    REACHABLE = 2;
    UNREACHABLE = 3;
  }
  Status status = 10;
  google.protobuf.Timestamp last_seen_at = 11;
  google.protobuf.Timestamp created_at = 12;

  // Pinned and verified exactly as a target's is: a build host is handed
  // repository credentials, so connecting to the wrong machine matters at least
  // as much here.
  HostKey host_key = 13;
}

message CreateBuildHostRequest {
  Mutation mutation = 1;
  string name = 2;
  string host = 3;
  uint32 port = 4;
  string user = 5;
  string ssh_key_id = 6;
  string workspace_root = 7;
  bool latency_critical = 8;
  map<string, string> labels = 9;
}

message UpdateBuildHostRequest {
  Mutation mutation = 1;
  string id = 2;
  BuildHost build_host = 3;     // fields present in update_mask
  repeated string update_mask = 4;
}

message DeleteBuildHostRequest {
  Mutation mutation = 1;
  string id = 2;
}

message GetBuildHostRequest { string id = 1; }

message ListBuildHostsRequest {
  string label_selector = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListBuildHostsResponse {
  repeated BuildHost build_hosts = 1;
  string next_page_token = 2;
}

// Accepts a build host's current host key, promoting a pending change to the
// pinned one. Guarded and audited like any other mutation.
message AcceptBuildHostKeyRequest {
  Mutation mutation = 1;
  string id = 2;
  // The fingerprint being accepted, which must match the pending one — so the
  // acceptance refers to the key the operator looked at rather than to whatever
  // is pending when the request lands.
  string fingerprint = 3;
}

// Forgets a build host's pinned key, reopening the first-use window.
message ForgetBuildHostKeyRequest {
  Mutation mutation = 1;
  string id = 2;
}

// Probes a build host the way `CheckTarget` probes a target: each prerequisite
// separately, so a failure names the part that is broken.
message CheckBuildHostRequest { string id = 1; }

message CheckBuildHostResponse {
  bool ok = 1;
  message Check {
    // "host_key", "ssh", "workspace", "git", "toolchain"
    string name = 1;
    bool ok = 2;
    string detail = 3;
  }
  repeated Check checks = 2;

  // Non-fatal things worth saying — currently, that this host is marked
  // latency-critical and a build on it will contend with whatever else runs
  // there. Separate from `checks` because it must not make `ok` false.
  repeated string warnings = 3;
}

// The value of a `build_host_id` that means "the control plane", as opposed to
// an unset field meaning "whatever the instance default is".
//
// A service pinned to local with this stays local even after an operator points
// the instance at a build host, which an empty string could not express.
//
// Not an enum: `build_host_id` is an id, and a reserved id costs one constant
// where a wrapper message would cost a migration and a proto change at every
// call site.
//
// const LOCAL_BUILD_HOST_ID = "local"

// The build host used when a service does not name one.
//
// Empty means the control plane, which is the default and the behaviour of
// every instance that configures nothing.
message BuildDefaults {
  string build_host_id = 1;
}

message GetBuildDefaultsRequest {}

message SetBuildDefaultsRequest {
  Mutation mutation = 1;
  string build_host_id = 2;
}

// ---------------------------------------------------------------------------
// Services — a deployable unit on a target (one systemd unit)
// ---------------------------------------------------------------------------

message HealthCheck {
  oneof kind {
    string http_url = 1;        // GET, expect 2xx
    string command = 2;         // run on target, expect exit 0
    bool systemd_active = 3;    // just trust `systemctl is-active`
  }
  uint32 timeout_seconds = 4;
  uint32 retries = 5;
  uint32 initial_delay_seconds = 6;
}

// Where the binary comes from.
message ArtifactSource {
  oneof kind {
    // Prebuilt binary at a URL (GitHub release asset, S3, etc.)
    string url = 1;
    // Built by the control plane from a connected git source.
    GitSource git = 2;
    // Pushed directly by the CLI (`ctl deploy ./target/release/bot`).
    bool direct_upload = 3;
  }
}

message GitSource {
  string source_id = 1;         // -> Source (GitHub App installation)
  string repo = 2;              // "owner/name"
  string branch = 3;
  string build_command = 4;     // e.g. "cargo build --release"
  string artifact_path = 5;     // e.g. "target/release/bot"
  bool auto_deploy_on_push = 6;

  // Where this service's build runs, overriding the instance default. A repo
  // needing a GPU or a particular toolchain is a per-service fact.
  //
  // Three states, and the difference matters: unset falls back to the instance
  // default, the sentinel below forces the control plane whatever that default
  // is, and any other value names a build host.
  string build_host_id = 7;
}

message SystemdUnit {
  string unit_name = 1;         // "hft-bot.service"
  string description = 2;
  string exec_args = 3;         // args appended to the binary in ExecStart
  string working_directory = 4;
  string user = 5;
  string group = 6;
  string restart = 7;           // "always" | "on-failure" | "no"
  uint32 restart_sec = 8;
  repeated string after = 9;    // unit ordering
  // Latency knobs — the reason this tool exists instead of Docker.
  string cpu_affinity = 10;     // "2-5"
  string nice = 11;
  string io_scheduling_class = 12;
  map<string, string> extra_directives = 13; // escape hatch, verbatim
}

message Service {
  string id = 1;
  string target_id = 2;
  string name = 3;

  ArtifactSource artifact = 4;
  SystemdUnit unit = 5;
  HealthCheck health_check = 6;

  string release_root = 7;      // "/opt/<name>" — releases/ + current symlink live here
  uint32 keep_releases = 8;     // how many old releases to retain for rollback

  // Secret ids only. Values are resolved server-side and written to the
  // target's EnvironmentFile at deploy time; they never transit this API.
  repeated string secret_ids = 9;
  map<string, string> env = 10; // non-secret env

  string current_release_id = 11;
  google.protobuf.Timestamp created_at = 12;

  // Where this service is reachable from the outside, if anywhere.
  //
  // Empty — every service that predates ingress — means not routed, which is
  // what is true of every service that reaches its target by IP and port.
  //
  // Only meaningful when the target has ingress enabled. Routes on a target
  // with no ingress are stored and refused at the point they would be used,
  // rather than silently ignored.
  //
  // Replaced on update as a whole rather than merged: a route has no id, so
  // there is nothing to merge against, and "set the routes to exactly this" is
  // the operation every caller actually wants.
  repeated Route routes = 13;
}

message CreateServiceRequest {
  Mutation mutation = 1;
  Service service = 2;
}

message UpdateServiceRequest {
  Mutation mutation = 1;
  string id = 2;
  Service service = 3;
  repeated string update_mask = 4;
}

message DeleteServiceRequest {
  Mutation mutation = 1;
  string id = 2;
  bool stop_and_disable_unit = 3;
  bool remove_release_dir = 4;
}

message GetServiceRequest { string id = 1; }

message ListServicesRequest {
  string target_id = 1;         // optional filter
  uint32 page_size = 2;
  string page_token = 3;
}

message ListServicesResponse {
  repeated Service services = 1;
  string next_page_token = 2;
}

// Renders the systemd unit that would be written, without writing it.
message RenderUnitRequest { string service_id = 1; }
message RenderUnitResponse { string unit_file = 1; }

// ---------------------------------------------------------------------------
// Deployments
// ---------------------------------------------------------------------------

message Release {
  string id = 1;
  string service_id = 2;
  string git_sha = 3;
  string git_ref = 4;
  string artifact_digest = 5;   // sha256 of the binary
  uint64 artifact_bytes = 6;
  string path = 7;              // <release_root>/releases/<id>
  google.protobuf.Timestamp created_at = 8;
}

message Deployment {
  string id = 1;
  string service_id = 2;
  string release_id = 3;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    QUEUED = 1;
    BUILDING = 2;
    UPLOADING = 3;
    ACTIVATING = 4;   // symlink swap + daemon-reload + restart
    HEALTH_CHECKING = 5;
    SUCCEEDED = 6;
    FAILED = 7;
    ROLLED_BACK = 8;
    CANCELLED = 9;
  }
  Status status = 4;

  Actor actor = 5;
  string previous_release_id = 6;  // what we'd roll back to
  string error = 7;

  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
}

message DeployRequest {
  Mutation mutation = 1;
  string service_id = 2;
  // Optional overrides for this deploy only.
  string git_ref = 3;           // branch, tag, or sha
  string artifact_url = 4;      // when pushing a prebuilt binary
  bool skip_health_check = 5;
  bool auto_rollback_on_failure = 6; // default true server-side
}

message RollbackRequest {
  Mutation mutation = 1;
  string service_id = 2;
  string release_id = 3;        // empty = previous release
}

message CancelDeploymentRequest {
  Mutation mutation = 1;
  string deployment_id = 2;
}

message GetDeploymentRequest { string id = 1; }

message ListDeploymentsRequest {
  string service_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  string next_page_token = 2;
}

message ListReleasesRequest { string service_id = 1; }
message ListReleasesResponse { repeated Release releases = 1; }

// Live deployment progress: status transitions plus build/deploy output.
message WatchDeploymentRequest { string deployment_id = 1; }

message DeploymentEvent {
  google.protobuf.Timestamp at = 1;
  oneof event {
    Deployment.Status status_change = 2;
    string output_line = 3;
    Deployment terminal_state = 4;  // final message before stream closes
  }
}

// ---------------------------------------------------------------------------
// Unit control — start/stop/restart without deploying
// ---------------------------------------------------------------------------

message UnitActionRequest {
  Mutation mutation = 1;
  string service_id = 2;
  enum Action {
    ACTION_UNSPECIFIED = 0;
    START = 1;
    STOP = 2;
    RESTART = 3;
    RELOAD = 4;
    ENABLE = 5;
    DISABLE = 6;
  }
  Action action = 3;
}

message UnitStatus {
  string service_id = 1;
  string active_state = 2;      // "active", "failed", ...
  string sub_state = 3;         // "running", "exited", ...
  bool enabled = 4;
  uint32 pid = 5;
  uint64 memory_bytes = 6;
  google.protobuf.Timestamp since = 7;
  uint32 restart_count = 8;
}

message GetUnitStatusRequest { string service_id = 1; }

// ---------------------------------------------------------------------------
// Logs
// ---------------------------------------------------------------------------

message LogLine {
  google.protobuf.Timestamp at = 1;
  string message = 2;
  string priority = 3;          // journald priority
  string unit = 4;
  string cursor = 5;            // journald cursor, for resume
}

message StreamLogsRequest {
  string service_id = 1;
  bool follow = 2;
  uint32 tail_lines = 3;        // backfill from the ring buffer before following
  string since_cursor = 4;      // resume after a dropped connection
  google.protobuf.Timestamp since = 5;
  string grep = 6;
}

// One-shot command on a target. Deliberately separate from the interactive
// terminal: this is the shape an agent can actually use.
message RunCommandRequest {
  Mutation mutation = 1;
  string target_id = 2;
  string command = 3;
  repeated string args = 4;
  uint32 timeout_seconds = 5;
}

message CommandOutput {
  oneof chunk {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;        // final message
  }
}

// ---------------------------------------------------------------------------
// Terminal — interactive PTY over ssh
// ---------------------------------------------------------------------------

// Short-lived, single-use, scoped to one target. The websocket endpoint
// accepts only this token, never a raw host.
message CreateTerminalSessionRequest {
  Mutation mutation = 1;
  string target_id = 2;
  string initial_command = 3;   // empty = login shell
  uint32 cols = 4;
  uint32 rows = 5;
}

message TerminalSession {
  string id = 1;
  string token = 2;
  string websocket_url = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Also exposed as a bidi stream so the CLI can attach without a browser.
message TerminalClientMessage {
  oneof message {
    TerminalSession attach = 1;   // first message: session id + token
    bytes stdin = 2;
    TerminalResize resize = 3;
    bool close = 4;
  }
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalServerMessage {
  oneof message {
    bytes stdout = 1;
    int32 exit_code = 2;
    string error = 3;
  }
}

// ---------------------------------------------------------------------------
// Sources — GitHub App integration
// ---------------------------------------------------------------------------

message Source {
  string id = 1;
  string name = 2;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    GITHUB_APP = 1;
    DEPLOY_KEY = 2;   // plain ssh clone, no App
  }
  Kind kind = 3;

  // GitHub App fields. Private key and webhook secret live in the secret
  // store and are never returned over this API.
  int64 app_id = 4;
  string app_slug = 5;
  string html_url = 6;
  int64 installation_id = 7;
  string account_login = 8;

  bool installed = 9;
  google.protobuf.Timestamp created_at = 10;
}

// Step 1 of the manifest flow: we generate the manifest and hand back a URL
// the browser POSTs to. GitHub redirects to our callback with a temporary
// code, which we exchange for app_id + private key + webhook secret.
message CreateGithubAppManifestRequest {
  Mutation mutation = 1;
  string name = 2;
  string organization = 3;      // empty = personal account
  string base_url = 4;          // our public URL, for callback + webhook
}

message CreateGithubAppManifestResponse {
  string source_id = 1;         // pending source row
  string manifest_json = 2;
  string post_url = 3;          // https://github.com/settings/apps/new?state=...
  string state = 4;
}

// Step 2: called by the HTTP callback handler after GitHub redirects back.
message ExchangeGithubManifestCodeRequest {
  string state = 1;
  string code = 2;
}

message ListSourcesRequest {}
message ListSourcesResponse { repeated Source sources = 1; }

message ListRepositoriesRequest {
  string source_id = 1;
  string query = 2;
}

message Repository {
  string full_name = 1;
  string default_branch = 2;
  bool private = 3;
  string clone_url = 4;
}

message ListRepositoriesResponse { repeated Repository repositories = 1; }

message ListBranchesRequest {
  string source_id = 1;
  string repo = 2;
}

message ListBranchesResponse { repeated string branches = 1; }

message DeleteSourceRequest {
  Mutation mutation = 1;
  string id = 2;
}

// ---------------------------------------------------------------------------
// Secrets
// ---------------------------------------------------------------------------

// Values are write-only over this API. Reads return metadata only.
message Secret {
  string id = 1;
  string name = 2;
  string scope_target_id = 3;   // optional narrowing
  string scope_service_id = 4;
  google.protobuf.Timestamp updated_at = 5;
  string digest = 6;            // sha256 of value, to detect drift
}

message PutSecretRequest {
  Mutation mutation = 1;
  string name = 2;
  string value = 3;
  string scope_target_id = 4;
  string scope_service_id = 5;

  // Rotate a name that already exists, rather than refusing.
  //
  // Unset is the safe default and what an existing client sends: a value cannot
  // be read back, so overwriting one destroys something unrecoverable and leaves
  // nothing to say what was lost. Rotation is a real operation — a leaked key has
  // to be replaceable — so it stays available, deliberately.
  bool replace = 6;
}

message ListSecretsRequest {
  string target_id = 1;
  string service_id = 2;
}

message ListSecretsResponse { repeated Secret secrets = 1; }

message DeleteSecretRequest {
  Mutation mutation = 1;
  string id = 2;
}

// ---------------------------------------------------------------------------
// Audit
// ---------------------------------------------------------------------------

message AuditEntry {
  string id = 1;
  google.protobuf.Timestamp at = 2;
  Actor actor = 3;
  string action = 4;            // rpc name
  string subject_id = 5;        // target / service / deployment id
  bool dry_run = 6;
  string summary = 7;
}

message ListAuditRequest {
  string subject_id = 1;
  Actor.Kind actor_kind = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListAuditResponse {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------
// Services
// ---------------------------------------------------------------------------

service Targets {
  rpc Create(CreateTargetRequest) returns (Target);
  rpc Get(GetTargetRequest) returns (Target);
  rpc List(ListTargetsRequest) returns (ListTargetsResponse);
  rpc Update(UpdateTargetRequest) returns (Target);
  rpc Delete(DeleteTargetRequest) returns (google.protobuf.Empty);
  rpc Check(CheckTargetRequest) returns (CheckTargetResponse);

  // Host-key pinning. A change is refused until it is accepted here.
  rpc AcceptHostKey(AcceptHostKeyRequest) returns (Target);
  rpc ForgetHostKey(ForgetHostKeyRequest) returns (Target);

  // Ingress. On `Targets` rather than a service of its own because ingress is
  // a property of the host: it is configured per target, and there is exactly
  // one per target.
  rpc EnableIngress(EnableIngressRequest) returns (Target);
  rpc DisableIngress(DisableIngressRequest) returns (Target);
  // Renders the proxy config without writing it — the `RenderUnit` of ingress.
  rpc RenderIngress(RenderIngressRequest) returns (RenderIngressResponse);
  rpc ReloadIngress(ReloadIngressRequest) returns (ReloadIngressResponse);
  rpc CheckIngress(CheckIngressRequest) returns (CheckIngressResponse);
}

service BuildHosts {
  rpc Create(CreateBuildHostRequest) returns (BuildHost);
  rpc Get(GetBuildHostRequest) returns (BuildHost);
  rpc List(ListBuildHostsRequest) returns (ListBuildHostsResponse);
  rpc Update(UpdateBuildHostRequest) returns (BuildHost);
  rpc Delete(DeleteBuildHostRequest) returns (google.protobuf.Empty);
  rpc Check(CheckBuildHostRequest) returns (CheckBuildHostResponse);

  // Host-key pinning, as for a target: a change is refused until accepted.
  rpc AcceptHostKey(AcceptBuildHostKeyRequest) returns (BuildHost);
  rpc ForgetHostKey(ForgetBuildHostKeyRequest) returns (BuildHost);

  // The instance-wide default, which a service's own setting overrides.
  rpc GetDefaults(GetBuildDefaultsRequest) returns (BuildDefaults);
  rpc SetDefaults(SetBuildDefaultsRequest) returns (BuildDefaults);
}

service ServicesApi {
  rpc Create(CreateServiceRequest) returns (Service);
  rpc Get(GetServiceRequest) returns (Service);
  rpc List(ListServicesRequest) returns (ListServicesResponse);
  rpc Update(UpdateServiceRequest) returns (Service);
  rpc Delete(DeleteServiceRequest) returns (google.protobuf.Empty);
  rpc RenderUnit(RenderUnitRequest) returns (RenderUnitResponse);

  rpc UnitAction(UnitActionRequest) returns (UnitStatus);
  rpc GetUnitStatus(GetUnitStatusRequest) returns (UnitStatus);
  // Live status for the dashboard's service list — one stream, all services.
  rpc WatchUnitStatus(ListServicesRequest) returns (stream UnitStatus);
}

service Deployments {
  rpc Deploy(DeployRequest) returns (Deployment);
  rpc Rollback(RollbackRequest) returns (Deployment);
  rpc Cancel(CancelDeploymentRequest) returns (Deployment);
  rpc Get(GetDeploymentRequest) returns (Deployment);
  rpc List(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc Watch(WatchDeploymentRequest) returns (stream DeploymentEvent);
}

service Logs {
  rpc Stream(StreamLogsRequest) returns (stream LogLine);
  rpc RunCommand(RunCommandRequest) returns (stream CommandOutput);
}

service Terminals {
  rpc CreateSession(CreateTerminalSessionRequest) returns (TerminalSession);
  rpc Attach(stream TerminalClientMessage) returns (stream TerminalServerMessage);
}

service Sources {
  rpc CreateGithubAppManifest(CreateGithubAppManifestRequest) returns (CreateGithubAppManifestResponse);
  rpc ExchangeGithubManifestCode(ExchangeGithubManifestCodeRequest) returns (Source);
  rpc List(ListSourcesRequest) returns (ListSourcesResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc Delete(DeleteSourceRequest) returns (google.protobuf.Empty);
}

service Secrets {
  rpc Put(PutSecretRequest) returns (Secret);
  rpc List(ListSecretsRequest) returns (ListSecretsResponse);
  rpc Delete(DeleteSecretRequest) returns (google.protobuf.Empty);
}

service Audit {
  rpc List(ListAuditRequest) returns (ListAuditResponse);
}
