# Changelog generation, run by .github/workflows/release.yml on tag push.
#
# Adapted from Coolify's cliff.toml, with one substantial departure: Coolify
# uses conventional commits, so its parsers key off `feat:`/`fix:` prefixes and
# it drops anything that does not match. This repository writes commit subjects
# as ordinary sentences ("Add the release check, changelog and support prompt"),
# so grouping by prefix would put every commit in "Other" and filtering by it
# would produce an empty changelog.
#
# Instead commits are grouped by what they say, and nothing is filtered out. A
# generated changelog that quietly omits a commit is worse than a noisy one:
# the omission is invisible, and someone reading it to decide whether to upgrade
# would never know.
#
# Only the subject line of each commit is used, not the full message. This
# repository writes long explanatory commit bodies — which belong in the log,
# where someone is asking "why is this code like this" — but splicing them into
# a changelog produced 30,000 characters of prose for one release, rendered
# inside a dashboard banner. The subject is the summary; the body is available
# one click away in the commit itself.

[changelog]
header = """
# Changelog

Every release of nudo. Generated from the commit log by git-cliff, so it
reflects what actually landed rather than what someone remembered to write
down.

Also rendered inside the dashboard under "What's new" — see `releases.json`,
which is the manifest a running instance fetches.

"""

body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}

"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
# Off, because this repository does not use them. See the note at the top.
conventional_commits = false
# Nothing is dropped for failing to match a convention.
filter_unconventional = false
split_commits = false

commit_preprocessors = [
  # Strip the trailing PR reference GitHub appends on a squash merge, so the
  # subject reads as a sentence.
  { pattern = ' \\(#[0-9]+\\)$', replace = "" },
]

# Grouped by what a commit did, matched against prose subjects. A commit that
# matches nothing lands in "Other" rather than being discarded.
commit_parsers = [
  # Housekeeping that nobody upgrading needs to read about. These are the only
  # commits skipped, and each is skipped because it changes nothing about how
  # nudo behaves.
  # The release workflow's own commits. They record that a release happened,
  # which is not news to anyone reading that release's notes, and they pile up:
  # each release adds one, so every subsequent changelog carried the previous
  # runs' bookkeeping alongside the actual changes.
  { message = "^Publish v?[0-9]", skip = true },
  # Both spellings of the bump commit: "Release the version" and the bare
  # "Release 0.2.0" this repository actually writes. The earlier rule required
  # the literal word "version", so `Release 0.1.1` was published to operators
  # as a change in its own release's notes.
  { message = "^(?i)(bump|release) (the )?version", skip = true },
  { message = "^(?i)(bump|release) v?[0-9]", skip = true },
  { message = "^(?i)update (the )?lockfile", skip = true },
  { message = "^(?i)merge (branch|pull request)", skip = true },

  { message = "^(?i)(add|introduce|implement|support)", group = "<!-- 0 -->Added" },
  { message = "^(?i)(fix|correct|repair|stop|prevent)", group = "<!-- 1 -->Fixed" },
  { message = "^(?i)(change|rename|move|replace|switch|make|refactor|rework|simplify|tighten)", group = "<!-- 2 -->Changed" },
  { message = "^(?i)(remove|drop|delete)", group = "<!-- 3 -->Removed" },
  { message = "^(?i)(document|describe|explain|note)", group = "<!-- 4 -->Documentation" },
  # Security-relevant work is called out separately whatever its verb, because
  # it is the one category people scan for before deciding to upgrade.
  { body = "(?i)(security|vulnerab|CVE-)", group = "<!-- 5 -->Security" },
  { message = "^(?i)(test|verify|assert|cover)", group = "<!-- 6 -->Testing" },
  { message = "^(?i)revert", group = "<!-- 7 -->Reverted" },
  { message = ".*", group = "<!-- 8 -->Other" },
]

filter_commits = false
topo_order = false
sort_commits = "newest"
