[package]
name = "nudo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line client for the nudo control plane"

[[bin]]
name = "nudo"
path = "src/main.rs"

[dependencies]
nudo-proto.workspace = true

tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true

# io-std for stdin/stdout: the terminal command pumps the local terminal
# through the PTY stream, and `secrets set` reads a value from stdin.
tokio = { workspace = true, features = ["io-std"] }
tokio-stream.workspace = true
futures-util.workspace = true

clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The artifact-server test fetches the file back over HTTP.
reqwest.workspace = true
